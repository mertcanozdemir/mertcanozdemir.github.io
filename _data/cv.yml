- title: Research Profile
  type: list
  contents:
    - Recent PhD graduate in Biomedical Engineering with research expertise in deep learning-based cardiac MRI synthesis using diffusion models and attention mechanisms. Experienced in MR image reconstruction pipelines, DICOM data processing, and generative AI for medical imaging. Seeking to expand into ultra-high field MRI acquisition and reconstruction, combining computational skills with hands-on scanner experience.

- title: Education
  type: time_table
  contents:
    - title: PhD in Biomedical Engineering
      institution: TOBB University of Economics and Technology, Ankara
      year: 2019 - 2025
      description:
        - "Thesis: Cardiac MRI Image Data Augmentation Using Diffusion Model-Based Asymmetric Attention Mechanisms"
        - Developed a novel asymmetric attention-enhanced diffusion model for synthesizing realistic cardiac cine MRI sequences from the OCMR dataset.
        - Achieved FID score of 77.78; radiologists distinguished synthetic from real images with only 60% accuracy in clinical validation.
        - Extensive experience with k-space data, DICOM pipelines, cardiac cine reconstruction, and evaluation metrics (FID, SSIM, MS-SSIM).
    - title: MSc in Biomedical Engineering
      institution: TOBB University of Economics and Technology, Ankara
      year: 2017 - 2019

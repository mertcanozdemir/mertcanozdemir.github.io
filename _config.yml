# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: blank # if blank, the full name is used instead
first_name: Mertcan
middle_name:
last_name: Özdemir
email: mertcanozdemir@yahoo.com

description: >
  Personal site of Mertcan Özdemir, PhD — biomedical engineer working on medical
  image processing and deep learning for MRI.
keywords: biomedical engineering, medical image processing, deep learning, MRI, diffusion models, cardiac MRI

lang: en
icon: 🐱 # emoji used as the favicon
url: https://mertcanozdemir.com
baseurl:

# Only used for link previews; no image is shown on the site itself.
og_image: /assets/img/prof_pic.jpg

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# jekyll-scholar renders {% bibliography %} on the about page through
# _layouts/bib-simple.liquid. The name lists mark which author is the site owner.
scholar:
  last_name: [Özdemir, Ozdemir]
  first_name: [Mertcan, M.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib-simple
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  sort_by: year,month
  order: descending

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

plugins:
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-minifier

include: ["_pages"]

exclude:
  - bin/
  - CLAUDE.md
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - vendor

keep_files:
  - CNAME
  - .nojekyll

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  exclude: ["robots.txt"]
  uglifier_args:
    harmony: true
